<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <!-- The bundle's files are relative (vite.config.ts base): the admin page is at the hub's root only (docs/web/web.md "Sub-path"). -->
    <base href="/" />
    <link rel="icon" href="/app-icon-64.png" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/app-icon-dark-64.png" type="image/png" media="(prefers-color-scheme: dark)" />
    <title>Persona 管理</title>
    <script src="compatibility-bootstrap.js"></script>
    <script>
      // Pick the theme before the first paint so a dark page never flashes white (same setting as the web client).
      try {
        var t = localStorage.getItem("persona.theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
