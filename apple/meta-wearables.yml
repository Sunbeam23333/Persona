# Meta glasses (Ray-Ban Meta and friends) through Meta's Wearables Device Access Toolkit (docs/apple/meta-glasses.md).
# Merged into project.yml by its `include:` (enable: ${PERSONA_META_WEARABLES}), which scripts/persona_config.py env
# sets to YES only when config.json app.meta_wearables.enabled is true. Off by default: no package, no Info.plist keys,
# no Bluetooth or local-network permission strings, and no menu entry, so the App Store build is unchanged.
# Why it is opt-in: the SDK needs Xcode 26.4+ (Swift 6.3), while the repo still builds with Xcode 26.0, and the
# ExternalAccessory / Bluetooth / local-network keys below are extra review surface for App Store and TestFlight.
# Dictionaries merge and arrays append, so the keys here add to the ones in project.yml.
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1 # pinned: a new SDK release is taken on purpose, not by the next package resolve
targets:
  Persona:
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
    info:
      path: Persona/Resources/Info.plist
      properties:
        # The URL the Meta AI app calls back to (registration and camera permission); the app's own URL scheme
        # (CFBundleURLSchemes in project.yml: persona) is the one it is sent to.
        MWDAT:
          AppLinkURLScheme: "persona://"
          # Filled from config.json app.meta_wearables by scripts/persona_config.py xcconfig (0: Developer Mode).
          MetaAppID: $(PERSONA_META_APP_ID)
          ClientToken: $(PERSONA_META_CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral, external-accessory]
        NSBluetoothAlwaysUsageDescription: "Persona connects to your Meta glasses over Bluetooth when you ask it to take a photo with them, for example a whiteboard you want to attach to a message."
        NSLocalNetworkUsageDescription: "Persona finds your Meta glasses on the local network when you ask it to take a photo with them, for example to attach a photo of a receipt to a message."
        NSBonjourServices: [_bonjour._tcp]
