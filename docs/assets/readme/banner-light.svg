  <rect x="392.5" y="52.5" width="131" height="131" rx="29.0" fill="none" stroke="#e8e0d5"/>
  <text x="558.0" y="151" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" letter-spacing="-1" fill="#1c1814">Persona</text>
  <text x="640" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="0" fill="#6f665c" text-anchor="middle">Your SuperAgent. One place for every task.</text>
  <rect x=".5" y=".5" width="1279" height="299" rx="20" fill="none" stroke="#e8e0d5"/>
