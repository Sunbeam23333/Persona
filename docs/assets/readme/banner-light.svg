<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" lang="en">
<title>Persona — Your SuperAgent. One place for every task.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcfaf7"/><stop offset="1" stop-color="#f3eee7"/></linearGradient>
  <radialGradient id="glow" cx="640.0" cy="118.0" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6c4a5" stop-opacity="0.32"/><stop offset="1" stop-color="#f6c4a5" stop-opacity="0"/></radialGradient>
  <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3c1e0a" flood-opacity="0.14"/></filter>
