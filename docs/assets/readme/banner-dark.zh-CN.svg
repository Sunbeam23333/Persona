  <text x="640" y="250" font-family="'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', STSong, SimSun, serif" font-size="32" letter-spacing="1" fill="#a89c8f" text-anchor="middle">你的 SuperAgent，一个入口解决所有问题。</text>
  <rect x=".5" y=".5" width="1279" height="299" rx="20" fill="none" stroke="#2f2925"/>
